<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting to BGMI registration…</title>
<meta name="robots" content="noindex">
<!-- No-JS fallback: browsers without scripting still land on the form. -->
<meta http-equiv="refresh" content="3;url=https://tally.so/r/81DVgY">
<link rel="canonical" href="https://tally.so/r/81DVgY">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(80% 60% at 50% 0%, rgba(255,122,0,.18), transparent 60%), #050505;
    color:#fff;font-family:"Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;text-align:center;padding:24px}
  .box{max-width:440px}
  .brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;margin-bottom:30px}
  .brand em{font-style:normal;color:#ff7a00}
  .brand svg{width:30px;height:30px;fill:none;stroke:#ff7a00;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .loader{width:54px;height:54px;margin:0 auto 26px;border:4px solid rgba(255,255,255,.14);
    border-top-color:#ff7a00;border-radius:50%;animation:spin .9s linear infinite}
  h1{font-size:1.35rem;font-weight:800;margin:0 0 10px}
  h1 span{color:#ff7a00}
  p{color:#a8a8a8;font-size:.95rem;margin:0 0 22px;line-height:1.6}
  a.fallback{color:#ff7a00;font-weight:600;font-size:.9rem}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.loader{animation:none}}
</style>
</head>
<body>
  <div class="box">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 4v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V6z"/><path d="M8 11l3 3 5-5"/></svg>
      <span>Sky<em>Reign</em> Global</span>
    </div>
    <div class="loader" aria-hidden="true"></div>
    <h1>Redirecting in <span id="countdown">3</span>…</h1>
    <p>Taking you to the <strong>BGMI</strong> registration form for SRG Clutch Chapter 1.</p>
    <a class="fallback" href="https://tally.so/r/81DVgY">Not redirected? Open the form &rarr;</a>
  </div>

  <script>
    var target = "https://tally.so/r/81DVgY";
    var n = 3;
    var el = document.getElementById("countdown");
    var timer = setInterval(function () {
      n--;
      if (n > 0) { el.textContent = n; }
      else { clearInterval(timer); window.location.replace(target); }
    }, 1000);
  </script>
</body>
</html>
